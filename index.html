<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS Digital - Wall of ARMY</title>
    <!-- Importamos el cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { color: #b19cd9; font-size: 2.5rem; margin-bottom: 10px; }
        header p { color: #aaaaaa; }
        
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* Galería de imágenes */
        .section-title { font-size: 1.8rem; margin-bottom: 20px; border-bottom: 2px solid #b19cd9; padding-bottom: 5px; color: #b19cd9; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .gallery-item { background: #1e1e1e; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; display: block; }
        
        /* Muro de los ARMY */
        .wall-section { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        form { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 1rem; }
        button { background-color: #b19cd9; color: #121212; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #967bb6; }
        
        /* Mensajes en tarjeta */
        .messages-list { display: flex; flex-direction: column; gap: 15px; }
        .message-card { background: #252525; padding: 15px; border-radius: 8px; border-left: 4px solid #b19cd9; }
        .message-card h4 { color: #b19cd9; margin-bottom: 5px; }
        .message-card p { color: #ddd; margin-bottom: 8px; word-break: break-word; }
        .message-card span { font-size: 0.8rem; color: #777; }
    </style>
</head>
<body>

    <header>
        <h1>BTS Digital Portal</h1>
        <p>Galería oficial y Muro de amor para ARMY</p>
    </header>

    <div class="container">
        <!-- Galería -->
        <section>
            <h2 class="section-title">Galería ARMY</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500" alt="BTS 1"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=500" alt="BTS 2"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1526478806334-5fd488fcaabc?w=500" alt="BTS 3"></div>
            </div>
        </section>

        <!-- Muro de los ARMY -->
        <section class="wall-section">
            <h2 class="section-title">Wall of ARMY</h2>
            <form id="armyForm">
                <input type="text" id="nameInput" placeholder="Tu nombre o apodo ARMY" required>
                <textarea id="messageInput" rows="3" placeholder="Deja tu mensaje para BTS..." required></textarea>
                <button type="submit">Enviar Mensaje</button>
            </form>

            <div id="messagesContainer" class="messages-list">
                <p style="color: #888;">Cargando mensajes...</p>
            </div>
        </section>
    </div>

    <script>
        // Configuración de Supabase con tus credenciales
        const SUPABASE_URL = 'https://rcqnmjtxtpnjbgxdwroj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_eON3oZMtUh10DkcTiIYvEg_kNpOkJLN';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('armyForm');
        const nameInput = document.getElementById('nameInput');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        // Función para cargar los mensajes de Supabase
        async function fetchMessages() {
            const { data, error } = await _supabase
                .from('wall_of_army')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error al cargar:', error);
                messagesContainer.innerHTML = '<p style="color: #ff6b6b;">Error al cargar los mensajes.</p>';
                return;
            }

            if (data.length === 0) {
                messagesContainer.innerHTML = '<p style="color: #888;">Aún no hay mensajes. ¡Sé el primero en escribir!</p>';
                return;
            }

            messagesContainer.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'message-card';
                
                const date = new Date(item.created_at).toLocaleDateString();
                
                card.innerHTML = `
                    <h4>${escapeHtml(item.name)}</h4>
                    <p>${escapeHtml(item.message)}</p>
                    <span>${date}</span>
                `;
                messagesContainer.appendChild(card);
            });
        }

        // Función para enviar mensaje a la base de datos
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim();
            const message = messageInput.value.trim();

            if (!name || !message) return;

            const { error } = await _supabase
                .from('wall_of_army')
                .insert([{ name, message }]);

            if (error) {
                alert('Error al enviar el mensaje. Inténtalo de nuevo.');
                console.error(error);
            } else {
                nameInput.value = '';
                messageInput.value = '';
                fetchMessages(); // Recargar mensajes
            }
        });

        // Seguridad básica anti-scripting
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Cargar mensajes al abrir la página
        fetchMessages();
    </script>
</body>
</html>
