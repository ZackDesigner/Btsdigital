<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fondos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .gallery-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .gallery-card img {
            width: 130px;
            height: 175px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            margin: 0 auto 10px auto;
        }
        .download-btn {
            display: inline-block;
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <!-- Item 1 -->
        <div class="gallery-card">
            <img src="https://xatimg.com/image/D8KR7LbY8dFZ.png" alt="Fachada 1">
            <a href="https://xatimg.com/image/2T2SOcgqIDBY.png" class="download-btn" target="_blank">Descargar</a>
        </div>

        <!-- Item 2 -->
        <div class="gallery-card">
            <img src="https://xatimg.com/image/AbiQLTccKtbx.png" alt="Fachada 2">
            <a href="https://xatimg.com/image/V6RfyTOyNzF3.png" class="download-btn" target="_blank">Descargar</a>
        </div>

        <!-- Item 3 -->
        <div class="gallery-card">
            <img src="https://xatimg.com/image/VCeY2WmSvtmw.png" alt="Fachada 3">
            <a href="https://xatimg.com/image/BPV9hs74szwe.png" class="download-btn" target="_blank">Descargar</a>
        </div>

        <!-- Item 4 -->
        <div class="gallery-card">
            <img src="https://xatimg.com/image/g0tL4tAKHQg2.png" alt="Fachada 4">
            <a href="https://xatimg.com/image/wjq8o6TOyc9H.png" class="download-btn" target="_blank">Descargar</a>
        </div>

        <!-- Item 5 -->
        <div class="gallery-card">

</body>
</html>
